[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "chronontfs"
version = "0.1.0"
description = "Three-tier NTFS timestomping detection and timestamp recovery engine"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.8"
dependencies = [
    "click>=8.0",
]

[project.optional-dependencies]
dfir = ["dfir_ntfs>=1.1.20"]

[project.scripts]
chronontfs = "chronontfs.__main__:cli"
